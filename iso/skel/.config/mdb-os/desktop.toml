# MDB-OS Desktop Configuration
# Copy to ~/.config/mdb-os/desktop.toml and customize.

[theme]
background_color = [0.05, 0.05, 0.12, 1.0]  # Deep dark blue
panel_color = [0.08, 0.08, 0.16, 0.92]
panel_text_color = [0.9, 0.92, 0.96, 1.0]
border_focused = [0.0, 0.85, 0.95, 1.0]     # Cyan glow
border_unfocused = [0.25, 0.25, 0.35, 0.6]
border_width = 2
corner_radius = 8
font_size = 14.0

[keybindings]
modifier = "Super"
terminal = "Return"
launcher = "d"
close_window = "q"
fullscreen = "f"
workspace_next = "Right"
workspace_prev = "Left"
file_manager = "e"
lock_screen = "l"
logout = "Escape"

[panel]
height = 32
position = "top"
show_clock = true
show_mdb_status = true
show_workspaces = true
workspace_count = 4

[paths]
mdbfs_mount = "/home/user/mdb"
mdbfs_store = "/var/lib/mdbfs"
terminal_cmd = "foot"
file_manager_cmd = "thunar"
launcher_cmd = "fuzzel"
