[package]
name = "mdb-experiments"
version = "0.1.0"
edition = "2021"
description = "MDB Experiment Framework — real discovery engine with strict schemas and reproducibility"

[dependencies]
mdb-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
