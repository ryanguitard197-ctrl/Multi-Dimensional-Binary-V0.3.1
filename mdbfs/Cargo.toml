[package]
name = "mdbfs"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Guitard <ryan@mdb-os.dev>"]
description = "MDBFS — A FUSE filesystem backed by MDB dimensional storage"
license = "MIT"

[[bin]]
name = "mdbfs"
path = "src/main.rs"

[dependencies]
mdb-core = { path = "../core" }
fuser = "0.15"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
