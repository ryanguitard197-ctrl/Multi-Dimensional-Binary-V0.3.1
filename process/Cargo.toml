[package]
name = "mdb-process"
version = "0.1.0"
edition = "2021"
description = "MDB Process Model — SuperBit-based process management for MDB-OS"

[dependencies]
mdb-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
